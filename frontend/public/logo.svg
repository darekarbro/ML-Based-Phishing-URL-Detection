<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PhishGuard logo: gradient shield + https:// bar + red phishing hook -->
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#5AF0C2"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E9BFF"/>
      <stop offset="100%" stop-color="#22E0A6"/>
    </linearGradient>
  </defs>

  <!-- shield: lighter outer rim + gradient body -->
  <path d="M96 118 C186 66 326 66 416 118 C436 250 428 380 256 466 C84 380 76 250 96 118 Z" fill="url(#rim)"/>
  <path d="M115 139 C194 93 318 93 397 139 C414 255 408 373 256 445 C104 373 98 255 115 139 Z" fill="url(#body)"/>

  <!-- white URL bar -->
  <rect x="104" y="330" width="352" height="112" rx="56" fill="#ffffff" stroke="#E2E8F0" stroke-width="3"/>

  <!-- green padlock -->
  <path d="M156 378 v-14 a14 14 0 0 1 28 0 v14" fill="none" stroke="#10A34A" stroke-width="10" stroke-linecap="round"/>
  <rect x="146" y="366" width="48" height="44" rx="10" fill="#10A34A"/>
  <circle cx="170" cy="384" r="5" fill="#ffffff"/>
  <path d="M167 388 L173 388 L172 398 L168 398 Z" fill="#ffffff"/>

  <!-- https:// -->
  <text x="206" y="402" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="44" fill="#16324F">https://</text>

  <!-- browser menu dots -->
  <circle cx="426" cy="366" r="7" fill="#98A2AE"/>
  <circle cx="426" cy="386" r="7" fill="#98A2AE"/>
  <circle cx="426" cy="406" r="7" fill="#98A2AE"/>

  <!-- red fishing hook -->
  <g stroke="#F2203E" fill="none" stroke-linecap="round">
    <line x1="398" y1="56" x2="398" y2="262" stroke-width="24"/>
    <circle cx="398" cy="282" r="18" stroke-width="13"/>
    <line x1="398" y1="292" x2="398" y2="370" stroke-width="24"/>
    <path d="M398 370 A68 68 0 0 1 262 370" stroke-width="24"/>
    <line x1="262" y1="370" x2="262" y2="296" stroke-width="24"/>
    <line x1="262" y1="298" x2="284" y2="282" stroke-width="15"/>
  </g>

  <!-- accent rays -->
  <g stroke="#F2203E" stroke-width="14" stroke-linecap="round">
    <line x1="448" y1="148" x2="482" y2="118"/>
    <line x1="464" y1="198" x2="504" y2="182"/>
    <line x1="470" y1="248" x2="508" y2="246"/>
  </g>
</svg>
